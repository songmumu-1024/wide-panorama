<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wide Panorama · 突破 3:1 宽高比</title>
<style>
  :root {
    --bg: #0b0f18;
    --panel: #141a26;
    --panel-2: #1a2231;
    --line: #2a3547;
    --text: #e7edf7;
    --muted: #8b9ab3;
    --accent: #5b8cff;
    --accent-2: #7ee0c0;
    --warn: #ffb86b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 600px at 15% -10%, #1b2b4d 0%, transparent 60%),
      radial-gradient(900px 500px at 95% 0%, #153b38 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.7; }
  .badge {
    font-size: 12px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .badge.demo { border-color: #4a3a1f; color: var(--warn); background: #1d1710; }
  .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; margin-top: 28px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  label { font-size: 12px; color: var(--muted); letter-spacing: .3px; }
  textarea, input, select {
    width: 100%; margin-top: 8px; padding: 12px 14px;
    background: #0e1420; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 14px; outline: none;
  }
  textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: #0e1420; color: var(--muted);
    font-size: 13px; transition: .15s;
  }
  .chip:hover { border-color: #40527a; color: var(--text); }
  .chip.active { border-color: var(--accent); color: #fff; background: #16233c; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  button.primary {
    width: 100%; margin-top: 20px; padding: 13px 16px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #4b7dff, #7ee0c0);
    color: #08101f; font-weight: 700; font-size: 15px;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .examples .chip { font-size: 12px; }
  .bar { height: 6px; background: #0d1320; border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .status { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .steps { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.9; max-height: 150px; overflow: auto; }
  .preview {
    margin-top: 14px; border-radius: 12px; overflow: auto; background: #080c14;
    border: 1px solid var(--line); min-height: 180px; display: flex; align-items: center; justify-content: center;
  }
  .preview img { width: 100%; display: block; }
  .placeholder { color: #5b6a83; font-size: 13px; padding: 60px 0; }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
  .metric { background: #0e1420; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .metric b { display: block; font-size: 15px; margin-top: 3px; color: var(--accent-2); }
  .metric span { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .actions a {
    padding: 9px 14px; border-radius: 10px; text-decoration: none; font-size: 13px;
    border: 1px solid var(--line); color: var(--text); background: #0e1420;
  }
  .actions a:hover { border-color: var(--accent); }
  .error { margin-top: 12px; color: #ff8f8f; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  footer { margin-top: 34px; color: #5f6d84; font-size: 12px; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Wide <span>Panorama</span></h1>
      <div class="sub">单次生成不超过 3:1，通过“重叠窗口 + 逐段续画 + 羽化融合”拼出 6:1 / 8:1 的连续全景。</div>
    </div>
    <div class="badge" id="modeBadge">连接中…</div>
  </header>

  <div class="grid">
    <section class="card">
      <label for="prompt">画面提示词</label>
      <textarea id="prompt" placeholder="例如：黄昏时分的海岸线，远处灯塔，平静海面，电影感光线">黄昏时分的海岸线，远处灯塔，平静海面，电影感光线</textarea>
      <div class="examples" id="examples">
        <span class="chip">雪山日出全景</span>
        <span class="chip">城市天际线夜景</span>
        <span class="chip">未来科技展厅</span>
        <span class="chip">沙漠公路旅拍</span>
      </div>

      <div class="row">
        <div>
          <label>目标宽高比</label>
          <div class="chips" id="ratios">
            <span class="chip" data-ratio="6:1">6:1</span>
            <span class="chip" data-ratio="8:1">8:1</span>
            <span class="chip" data-ratio="12:1">12:1</span>
          </div>
          <input id="ratioCustom" placeholder="或自定义，如 10:1" style="margin-top:10px" />
        </div>
        <div>
          <label>画面高度</label>
          <select id="height">
            <option value="768">768 px</option>
            <option value="1024" selected>1024 px</option>
            <option value="1536">1536 px</option>
          </select>
          <div class="hint">宽度 = 比例 × 高度，严格按目标输出，不做拉伸或裁切。</div>
        </div>
      </div>

      <button class="primary" id="go">生成全景图</button>
      <div class="hint" id="estimate">按当前设置：预计 3 次生成调用</div>
    </section>

    <section class="card">
      <label>生成进度</label>
      <div class="bar"><i id="barFill"></i></div>
      <div class="status"><span id="statusText">等待开始</span><span id="pctText">0%</span></div>
      <div class="steps" id="steps"></div>
      <div class="error" id="error" hidden></div>

      <div class="preview" id="preview"><div class="placeholder">生成结果会显示在这里</div></div>
      <div class="metrics" id="metrics"></div>
      <div class="actions" id="actions"></div>
    </section>
  </div>

  <footer>
    技术路线：3:1 窗口内生成 → 每段与左侧重叠 15% → 色彩统计对齐 → smoothstep 羽化 → 接缝梯度指标校验。详见仓库 README。
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let currentRatio = "6:1";
let timer = null;

fetch("/api/health").then(r => r.json()).then(d => {
  const badge = $("modeBadge");
  if (d.demo_mode) {
    badge.textContent = "演示后端（Mock，可离线运行）";
    badge.classList.add("demo");
  } else {
    badge.textContent = d.provider + " · 模型已连接";
  }
}).catch(() => { $("modeBadge").textContent = "服务未就绪"; });

function setRatio(value) {
  currentRatio = value;
  document.querySelectorAll("#ratios .chip").forEach(el => {
    el.classList.toggle("active", el.dataset.ratio === value);
  });
  $("ratioCustom").value = "";
  updateEstimate();
}
document.querySelectorAll("#ratios .chip").forEach(el => {
  el.addEventListener("click", () => setRatio(el.dataset.ratio));
});
$("ratioCustom").addEventListener("input", (e) => {
  currentRatio = e.target.value.trim();
  document.querySelectorAll("#ratios .chip").forEach(el => el.classList.remove("active"));
  updateEstimate();
});
$("height").addEventListener("change", updateEstimate);
$("examples").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) $("prompt").value = e.target.textContent;
});

function updateEstimate() {
  const m = currentRatio.match(/(\d+(?:\.\d+)?)\s*[:\/x]\s*(\d+(?:\.\d+)?)/);
  if (!m) { $("estimate").textContent = "比例格式：如 6:1"; return; }
  const ratio = parseFloat(m[1]) / parseFloat(m[2]);
  const maxSingle = 3, overlap = 0.15;
  const maxNew = maxSingle * (1 - overlap);
  const calls = ratio <= maxSingle ? 1 : 1 + Math.ceil((ratio - maxSingle) / maxNew);
  const width = Math.round(ratio * parseInt($("height").value) / 8) * 8;
  $("estimate").textContent = `按当前设置：输出约 ${width} × ${$("height").value} px，预计 ${calls} 次生成调用`;
}

function resetUI() {
  $("error").hidden = true;
  $("steps").innerHTML = "";
  $("metrics").innerHTML = "";
  $("actions").innerHTML = "";
  $("preview").innerHTML = '<div class="placeholder">生成中，请稍候…</div>';
  $("barFill").style.width = "0%";
  $("pctText").textContent = "0%";
}

$("go").addEventListener("click", async () => {
  const prompt = $("prompt").value.trim();
  if (!prompt) { $("error").hidden = false; $("error").textContent = "请填写提示词"; return; }
  resetUI();
  $("go").disabled = true;
  $("statusText").textContent = "提交任务…";
  try {
    const resp = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, ratio: currentRatio, height: parseInt($("height").value) }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || "提交失败");
    poll(data.job_id);
  } catch (err) {
    fail(err.message);
  }
});

function poll(jobId) {
  clearInterval(timer);
  timer = setInterval(async () => {
    try {
      const resp = await fetch(`/api/jobs/${jobId}`);
      const job = await resp.json();
      if (!resp.ok) throw new Error(job.detail || "查询失败");
      $("barFill").style.width = job.progress + "%";
      $("pctText").textContent = job.progress + "%";
      $("statusText").textContent = job.message || job.status;
      renderSteps(job);
      if (job.status === "done") { clearInterval(timer); render(job.result); }
      if (job.status === "error") { clearInterval(timer); fail(job.error); }
    } catch (err) {
      clearInterval(timer);
      fail(err.message);
    }
  }, 1200);
}

function renderSteps(job) {
  const steps = (job.result && job.result.steps) || [];
  const lines = steps.map(s =>
    `#${s.index} ${s.mode} · 画布 ${s.canvas_width}px · 色差 ${s.color_shift} · 接缝 ${s.seam_score} · ${s.seconds}s`
  );
  $("steps").innerHTML = lines.join("<br>");
}

function fail(message) {
  $("go").disabled = false;
  $("error").hidden = false;
  $("error").textContent = message || "未知错误";
  $("statusText").textContent = "生成失败";
}

function render(result) {
  $("go").disabled = false;
  $("statusText").textContent = "完成";
  const preview = $("preview");
  preview.innerHTML = "";
  const img = document.createElement("img");
  img.src = result.files.jpg;
  img.alt = "生成的全景图";
  preview.appendChild(img);

  const m = result.metrics;
  const items = [
    ["输出尺寸", `${result.width} × ${result.height}`],
    ["实际比例", `${result.actual_ratio.toFixed(2)} : 1`],
    ["调用次数", `${result.calls}`],
    ["最大单次比例", `${m.max_single_call_ratio} : 1`],
    ["接缝指标(最大)", `${m.seam_score_max}`],
    ["综合耗时", `${result.elapsed}s`],
  ];
  $("metrics").innerHTML = items.map(([k, v]) =>
    `<div class="metric"><span>${k}</span><b>${v}</b></div>`).join("");

  $("actions").innerHTML = `
    <a href="${result.files.png}" target="_blank" rel="noopener">下载 PNG</a>
    <a href="${result.files.jpg}" target="_blank" rel="noopener">下载 JPG</a>
    <a href="${result.files.meta}" target="_blank" rel="noopener">查看元数据</a>`;

  $("steps").innerHTML = result.steps.map(s =>
    `#${s.index} ${s.mode} · 画布 ${s.canvas_width}px · 色差 ${s.color_shift} · 接缝 ${s.seam_score} · ${s.seconds}s`
  ).join("<br>");
}

setRatio("6:1");
</script>
</body>
</html>
